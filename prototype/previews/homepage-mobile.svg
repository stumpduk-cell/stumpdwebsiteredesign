<svg xmlns="http://www.w3.org/2000/svg" width="390" height="4200" viewBox="0 0 390 4200"><rect x="0" y="0" width="390" height="4200" rx="0" fill="#10141E" stroke="none" stroke-width="1"/><rect x="0" y="0" width="390" height="70" rx="0" fill="#000000" stroke="none" stroke-width="1"/><rect x="18" y="12" width="90" height="46" rx="0" fill="#10141E" stroke="#C17A22" stroke-width="1"/><text x="63" y="39" fill="#F4F4F4" font-family="Arial" font-size="12" font-weight="800" text-anchor="middle">STUMP’D</text><rect x="296" y="16" width="76" height="38" rx="0" fill="#10141E" stroke="#C17A22" stroke-width="1"/><text x="334" y="40" fill="#E1D0B3" font-family="Arial" font-size="11" font-weight="800" text-anchor="middle">MENU</text><text x="20" y="118" fill="#C17A22" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">MENTAL STRENGTH THROUGH CRICKET</text><text x="20" y="190" fill="#F4F4F4" font-family="Georgia" font-size="49" font-weight="400"><tspan x="20" dy="0">Think Well.</tspan><tspan x="20" dy="58.8">Play Better.</tspan></text><text x="20" y="330" fill="#E1D0B3" font-family="Arial" font-size="17" font-weight="500"><tspan x="20" dy="0">Cricket is the training ground.</tspan><tspan x="20" dy="24.65">Confidence, focus and resilience</tspan><tspan x="20" dy="24.65">are the skills they take with them.</tspan></text><rect x="20" y="455" width="220" height="50" rx="0" fill="#C17A22" stroke="none" stroke-width="1"/><text x="130" y="486" fill="#10141E" font-family="Arial" font-size="11" font-weight="800" text-anchor="middle">SEE HOW IT WORKS  ↓</text><rect x="20" y="545" width="350" height="330" rx="0" fill="#161C28" stroke="#C17A22" stroke-width="1"/><text x="38" y="820" fill="#C17A22" font-family="Arial" font-size="14" font-weight="800"><tspan x="38" dy="0">EXISTING STUMP’D</tspan><tspan x="38" dy="17.5">PHOTOGRAPHY</tspan></text><rect x="0" y="920" width="390" height="510" rx="0" fill="#E1D0B3" stroke="none" stroke-width="1"/><text x="20" y="974" fill="#941E38" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">THE MOMENTS THAT MATTER</text><text x="20" y="1040" fill="#941E38" font-family="Georgia" font-size="43" font-weight="400"><tspan x="20" dy="0">The game</tspan><tspan x="20" dy="51.6">moves fast.</tspan></text><text x="20" y="1175" fill="#10141E" font-family="Georgia" font-size="29" font-weight="700"><tspan x="20" dy="0">The mind can learn</tspan><tspan x="20" dy="34.8">to reset.</tspan></text><text x="20" y="1280" fill="#10141E" font-family="Arial" font-size="17" font-weight="500"><tspan x="20" dy="0">Mistake. Pressure. Frustration.</tspan><tspan x="20" dy="25.5">Recognise it. Reset.</tspan><tspan x="20" dy="25.5">Choose what’s next.</tspan></text><text x="20" y="1490" fill="#F4F4F4" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">A SIMPLE IDEA THAT TRAVELS</text><text x="20" y="1570" fill="#C17A22" font-family="Georgia" font-size="51" font-weight="400" text-anchor="start">Next Ball.</text><text x="20" y="1635" fill="#E1D0B3" font-family="Arial" font-size="18" font-weight="500"><tspan x="20" dy="0">You cannot change what just</tspan><tspan x="20" dy="25.2">happened. You can influence</tspan><tspan x="20" dy="25.2">what you do next.</tspan></text><rect x="20" y="1780" width="350" height="2" rx="0" fill="#941E38" stroke="none" stroke-width="1"/><text x="20" y="1845" fill="#F4F4F4" font-family="Georgia" font-size="35" font-weight="700"><tspan x="20" dy="0">Step back.</tspan><tspan x="20" dy="45.5">Take a breath.</tspan><tspan x="20" dy="45.5">NEXT BALL.</tspan></text><rect x="0" y="2050" width="390" height="590" rx="0" fill="#000000" stroke="none" stroke-width="1"/><text x="20" y="2105" fill="#C17A22" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">ONE SHARED LANGUAGE</text><text x="20" y="2170" fill="#C17A22" font-family="Georgia" font-size="39" font-weight="400" text-anchor="start">The Stump’d 5.</text><text x="22" y="2250" fill="#C17A22" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">01</text><text x="78" y="2250" fill="#F4F4F4" font-family="Georgia" font-size="24" font-weight="400" text-anchor="start">Think.</text><rect x="20" y="2272" width="350" height="1" rx="0" fill="#372B1F" stroke="none" stroke-width="1"/><text x="22" y="2320" fill="#C17A22" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">02</text><text x="78" y="2320" fill="#F4F4F4" font-family="Georgia" font-size="24" font-weight="400" text-anchor="start">Reset.</text><rect x="20" y="2342" width="350" height="1" rx="0" fill="#372B1F" stroke="none" stroke-width="1"/><text x="22" y="2390" fill="#C17A22" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">03</text><text x="78" y="2390" fill="#F4F4F4" font-family="Georgia" font-size="24" font-weight="400" text-anchor="start">Focus.</text><rect x="20" y="2412" width="350" height="1" rx="0" fill="#372B1F" stroke="none" stroke-width="1"/><text x="22" y="2460" fill="#C17A22" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">04</text><text x="78" y="2460" fill="#F4F4F4" font-family="Georgia" font-size="24" font-weight="400" text-anchor="start">Communicate.</text><rect x="20" y="2482" width="350" height="1" rx="0" fill="#372B1F" stroke="none" stroke-width="1"/><text x="22" y="2530" fill="#C17A22" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">05</text><text x="78" y="2530" fill="#F4F4F4" font-family="Georgia" font-size="24" font-weight="400" text-anchor="start">Lead.</text><rect x="20" y="2552" width="350" height="1" rx="0" fill="#372B1F" stroke="none" stroke-width="1"/><rect x="0" y="2640" width="390" height="1110" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/><text x="20" y="2695" fill="#941E38" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">FIND YOUR STARTING POINT</text><text x="20" y="2760" fill="#941E38" font-family="Georgia" font-size="38" font-weight="400"><tspan x="20" dy="0">Built for the whole</tspan><tspan x="20" dy="45.6">cricket community.</tspan></text><rect x="20" y="2900" width="350" height="165" rx="0" fill="#F4F4F4" stroke="#941E38" stroke-width="1"/><text x="40" y="2955" fill="#941E38" font-family="Georgia" font-size="30" font-weight="400" text-anchor="start">Schools.</text><text x="40" y="2993" fill="#10141E" font-family="Arial" font-size="13" font-weight="500" text-anchor="start">Practical programmes for school and life.</text><text x="40" y="3038" fill="#941E38" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">EXPLORE  →</text><rect x="20" y="3090" width="350" height="165" rx="0" fill="#F4F4F4" stroke="#941E38" stroke-width="1"/><text x="40" y="3145" fill="#941E38" font-family="Georgia" font-size="30" font-weight="400" text-anchor="start">Clubs.</text><text x="40" y="3183" fill="#10141E" font-family="Arial" font-size="13" font-weight="500" text-anchor="start">A shared language for pressure and performance.</text><text x="40" y="3228" fill="#941E38" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">EXPLORE  →</text><rect x="20" y="3280" width="350" height="165" rx="0" fill="#F4F4F4" stroke="#941E38" stroke-width="1"/><text x="40" y="3335" fill="#941E38" font-family="Georgia" font-size="30" font-weight="400" text-anchor="start">Players.</text><text x="40" y="3373" fill="#10141E" font-family="Arial" font-size="13" font-weight="500" text-anchor="start">Individual tools for challenging moments.</text><text x="40" y="3418" fill="#941E38" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">EXPLORE  →</text><rect x="20" y="3470" width="350" height="165" rx="0" fill="#F4F4F4" stroke="#941E38" stroke-width="1"/><text x="40" y="3525" fill="#941E38" font-family="Georgia" font-size="30" font-weight="400" text-anchor="start">Parents.</text><text x="40" y="3563" fill="#10141E" font-family="Arial" font-size="13" font-weight="500" text-anchor="start">Support the player behind the performance.</text><text x="40" y="3608" fill="#941E38" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">EXPLORE  →</text><text x="20" y="3810" fill="#C17A22" font-family="Arial" font-size="10" font-weight="800" text-anchor="start">A PATHWAY THAT GROWS</text><text x="20" y="3870" fill="#C17A22" font-family="Georgia" font-size="38" font-weight="400" text-anchor="start">Spark to Core.</text><rect x="20" y="3940" width="350" height="1" rx="0" fill="#6D4A26" stroke="none" stroke-width="1"/><text x="22" y="3982" fill="#C17A22" font-family="Georgia" font-size="24" font-weight="400" text-anchor="start">Spark</text><text x="350" y="3980" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="end">9–11</text><rect x="20" y="4006" width="350" height="1" rx="0" fill="#6D4A26" stroke="none" stroke-width="1"/><text x="22" y="4048" fill="#C17A22" font-family="Georgia" font-size="24" font-weight="400" text-anchor="start">Foundation</text><text x="350" y="4046" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="end">11–13</text><rect x="20" y="4072" width="350" height="1" rx="0" fill="#6D4A26" stroke="none" stroke-width="1"/><text x="22" y="4114" fill="#C17A22" font-family="Georgia" font-size="24" font-weight="400" text-anchor="start">Core</text><text x="350" y="4112" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="end">14–17</text></svg>