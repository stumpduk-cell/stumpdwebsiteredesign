<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="4050" viewBox="0 0 1440 4050"><rect x="0" y="0" width="1440" height="4050" rx="0" fill="#10141E" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1440" height="92" rx="0" fill="#000000" stroke="none" stroke-width="1"/><rect x="48" y="18" width="124" height="56" rx="2" fill="#10141E" stroke="#C17A22" stroke-width="1"/><text x="110" y="44" fill="#F4F4F4" font-family="Arial" font-size="17" font-weight="800" text-anchor="middle">STUMP’D</text><text x="110" y="62" fill="#C17A22" font-family="Arial" font-size="8" font-weight="700" text-anchor="middle">OFFICIAL LOGO</text><text x="530" y="54" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="start">WHAT WE DO</text><text x="650" y="54" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="start">WHO IT’S FOR</text><text x="770" y="54" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="start">PATHWAY</text><text x="885" y="54" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="start">ABOUT</text><text x="1005" y="54" fill="#E1D0B3" font-family="Arial" font-size="11" font-weight="700" text-anchor="start">MEMBER LOG IN</text><rect x="1175" y="23" width="205" height="47" rx="2" fill="#C17A22" stroke="none" stroke-width="1"/><text x="1277" y="53" fill="#10141E" font-family="Arial" font-size="13" font-weight="800" text-anchor="middle">BOOK A CALL  →</text><text x="72" y="158" fill="#C17A22" font-family="Arial" font-size="13" font-weight="800" text-anchor="start">MENTAL STRENGTH THROUGH CRICKET</text><text x="72" y="255" fill="#F4F4F4" font-family="Georgia" font-size="90" font-weight="400"><tspan x="72" dy="0">Think Well.</tspan><tspan x="72" dy="108.0">Play Better.</tspan></text><text x="76" y="500" fill="#E1D0B3" font-family="Arial" font-size="24" font-weight="400"><tspan x="76" dy="0">Cricket is the training ground. Confidence, focus</tspan><tspan x="76" dy="34.8">and resilience are the skills they take with them.</tspan></text><rect x="76" y="615" width="255" height="56" rx="0" fill="#C17A22" stroke="none" stroke-width="1"/><text x="204" y="650" fill="#10141E" font-family="Arial" font-size="13" font-weight="800" text-anchor="middle">SEE HOW IT WORKS  ↓</text><text x="365" y="650" fill="#C17A22" font-family="Arial" font-size="13" font-weight="800" text-anchor="start">BOOK A PLANNING CALL</text><rect x="790" y="130" width="575" height="620" rx="0" fill="#211C18" stroke="#C17A22" stroke-width="1"/><rect x="810" y="150" width="535" height="580" rx="0" fill="#161C28" stroke="none" stroke-width="1"/><text x="835" y="655" fill="#C17A22" font-family="Arial" font-size="18" font-weight="800"><tspan x="835" dy="0">EXISTING STUMP’D</tspan><tspan x="835" dy="22.5">PHOTOGRAPHY</tspan></text><rect x="0" y="820" width="1440" height="500" rx="0" fill="#E1D0B3" stroke="none" stroke-width="1"/><text x="72" y="895" fill="#941E38" font-family="Arial" font-size="13" font-weight="800" text-anchor="start">THE MOMENTS THAT MATTER</text><text x="72" y="990" fill="#941E38" font-family="Georgia" font-size="58" font-weight="400"><tspan x="72" dy="0">The game moves fast.</tspan><tspan x="72" dy="69.6">The mind can learn to reset.</tspan></text><text x="780" y="1000" fill="#10141E" font-family="Arial" font-size="22" font-weight="500"><tspan x="780" dy="0">Mistake. Pressure. Frustration.</tspan><tspan x="780" dy="31.9">A decision that did not go your way.</tspan><tspan x="780" dy="31.9"></tspan><tspan x="780" dy="31.9">Recognise it. Reset. Choose what’s next.</tspan></text><text x="72" y="1405" fill="#F4F4F4" font-family="Arial" font-size="13" font-weight="800" text-anchor="start">A SIMPLE IDEA THAT TRAVELS</text><text x="72" y="1515" fill="#C17A22" font-family="Georgia" font-size="74" font-weight="400" text-anchor="start">Next Ball.</text><text x="74" y="1585" fill="#E1D0B3" font-family="Arial" font-size="24" font-weight="500"><tspan x="74" dy="0">You cannot change what just happened.</tspan><tspan x="74" dy="36.0">You can influence what you do next.</tspan></text><rect x="800" y="1390" width="2" height="340" rx="0" fill="#941E38" stroke="none" stroke-width="1"/><text x="855" y="1480" fill="#F4F4F4" font-family="Georgia" font-size="49" font-weight="700"><tspan x="855" dy="0">Step back.</tspan><tspan x="855" dy="63.7">Take a breath.</tspan><tspan x="855" dy="63.7">NEXT BALL.</tspan></text><rect x="0" y="1800" width="1440" height="430" rx="0" fill="#000000" stroke="none" stroke-width="1"/><text x="72" y="1875" fill="#C17A22" font-family="Arial" font-size="13" font-weight="800" text-anchor="start">ONE SHARED LANGUAGE</text><text x="72" y="1975" fill="#C17A22" font-family="Georgia" font-size="62" font-weight="400" text-anchor="start">The Stump’d 5.</text><text x="72" y="2070" fill="#C17A22" font-family="Arial" font-size="11" font-weight="800" text-anchor="start">01</text><text x="72" y="2140" fill="#F4F4F4" font-family="Georgia" font-size="25" font-weight="400" text-anchor="start">Think.</text><text x="332" y="2070" fill="#C17A22" font-family="Arial" font-size="11" font-weight="800" text-anchor="start">02</text><text x="332" y="2140" fill="#F4F4F4" font-family="Georgia" font-size="25" font-weight="400" text-anchor="start">Reset.</text><text x="592" y="2070" fill="#C17A22" font-family="Arial" font-size="11" font-weight="800" text-anchor="start">03</text><text x="592" y="2140" fill="#F4F4F4" font-family="Georgia" font-size="25" font-weight="400" text-anchor="start">Focus.</text><text x="852" y="2070" fill="#C17A22" font-family="Arial" font-size="11" font-weight="800" text-anchor="start">04</text><text x="852" y="2140" fill="#F4F4F4" font-family="Georgia" font-size="25" font-weight="400" text-anchor="start">Communicate.</text><text x="1112" y="2070" fill="#C17A22" font-family="Arial" font-size="11" font-weight="800" text-anchor="start">05</text><text x="1112" y="2140" fill="#F4F4F4" font-family="Georgia" font-size="25" font-weight="400" text-anchor="start">Lead.</text><rect x="0" y="2230" width="1440" height="890" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/><text x="72" y="2310" fill="#941E38" font-family="Arial" font-size="13" font-weight="800" text-anchor="start">FIND YOUR STARTING POINT</text><text x="72" y="2415" fill="#941E38" font-family="Georgia" font-size="60" font-weight="400"><tspan x="72" dy="0">Built for the whole</tspan><tspan x="72" dy="72.0">cricket community.</tspan></text><rect x="72" y="2600" width="638" height="215" rx="0" fill="#F4F4F4" stroke="#941E38" stroke-width="1"/><text x="100" y="2636" fill="#941E38" font-family="Arial" font-size="11" font-weight="800" text-anchor="start">01</text><text x="100" y="2691" fill="#941E38" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start">Schools.</text><text x="100" y="2732" fill="#10141E" font-family="Arial" font-size="15" font-weight="500" text-anchor="start">Programmes for confidence, focus and life beyond cricket.</text><text x="100" y="2781" fill="#941E38" font-family="Arial" font-size="12" font-weight="800" text-anchor="start">EXPLORE  →</text><rect x="730" y="2600" width="638" height="215" rx="0" fill="#F4F4F4" stroke="#941E38" stroke-width="1"/><text x="758" y="2636" fill="#941E38" font-family="Arial" font-size="11" font-weight="800" text-anchor="start">02</text><text x="758" y="2691" fill="#941E38" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start">Clubs.</text><text x="758" y="2732" fill="#10141E" font-family="Arial" font-size="15" font-weight="500" text-anchor="start">A shared language for pressure, communication and performance.</text><text x="758" y="2781" fill="#941E38" font-family="Arial" font-size="12" font-weight="800" text-anchor="start">EXPLORE  →</text><rect x="72" y="2845" width="638" height="215" rx="0" fill="#F4F4F4" stroke="#941E38" stroke-width="1"/><text x="100" y="2881" fill="#941E38" font-family="Arial" font-size="11" font-weight="800" text-anchor="start">03</text><text x="100" y="2936" fill="#941E38" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start">Players.</text><text x="100" y="2977" fill="#10141E" font-family="Arial" font-size="15" font-weight="500" text-anchor="start">Individual tools for the moments that challenge how you play.</text><text x="100" y="3026" fill="#941E38" font-family="Arial" font-size="12" font-weight="800" text-anchor="start">EXPLORE  →</text><rect x="730" y="2845" width="638" height="215" rx="0" fill="#F4F4F4" stroke="#941E38" stroke-width="1"/><text x="758" y="2881" fill="#941E38" font-family="Arial" font-size="11" font-weight="800" text-anchor="start">04</text><text x="758" y="2936" fill="#941E38" font-family="Georgia" font-size="34" font-weight="400" text-anchor="start">Parents.</text><text x="758" y="2977" fill="#10141E" font-family="Arial" font-size="15" font-weight="500" text-anchor="start">Understand the language and support the player behind the performance.</text><text x="758" y="3026" fill="#941E38" font-family="Arial" font-size="12" font-weight="800" text-anchor="start">EXPLORE  →</text><text x="72" y="3210" fill="#C17A22" font-family="Arial" font-size="13" font-weight="800" text-anchor="start">A PATHWAY THAT GROWS WITH THEM</text><text x="72" y="3300" fill="#C17A22" font-family="Georgia" font-size="61" font-weight="400" text-anchor="start">Spark to Core.</text><rect x="72" y="3385" width="1296" height="1" rx="0" fill="#6D4A26" stroke="none" stroke-width="1"/><text x="74" y="3435" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="start">YEARS 5–6 · AGES 9–11</text><text x="485" y="3442" fill="#C17A22" font-family="Georgia" font-size="38" font-weight="400" text-anchor="start">Spark</text><text x="940" y="3435" fill="#E1D0B3" font-family="Arial" font-size="14" font-weight="500" text-anchor="start">Confidence · Emotions · Teamwork</text><rect x="72" y="3505" width="1296" height="1" rx="0" fill="#6D4A26" stroke="none" stroke-width="1"/><text x="74" y="3555" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="start">AGES 11–13</text><text x="485" y="3562" fill="#C17A22" font-family="Georgia" font-size="38" font-weight="400" text-anchor="start">Foundation</text><text x="940" y="3555" fill="#E1D0B3" font-family="Arial" font-size="14" font-weight="500" text-anchor="start">Confidence · Emotions · Resilience</text><rect x="72" y="3625" width="1296" height="1" rx="0" fill="#6D4A26" stroke="none" stroke-width="1"/><text x="74" y="3675" fill="#E1D0B3" font-family="Arial" font-size="12" font-weight="700" text-anchor="start">AGES 14–17</text><text x="485" y="3682" fill="#C17A22" font-family="Georgia" font-size="38" font-weight="400" text-anchor="start">Core</text><text x="940" y="3675" fill="#E1D0B3" font-family="Arial" font-size="14" font-weight="500" text-anchor="start">Pressure · Performance · Responsibility</text><rect x="0" y="3820" width="1440" height="230" rx="0" fill="#941E38" stroke="none" stroke-width="1"/><text x="720" y="3885" fill="#F4F4F4" font-family="Arial" font-size="12" font-weight="800" text-anchor="middle">WHAT HAPPENS NEXT</text><text x="720" y="3960" fill="#F4F4F4" font-family="Georgia" font-size="43" font-weight="400" text-anchor="middle">Ready to start the conversation?</text><rect x="585" y="3985" width="270" height="48" rx="0" fill="#C17A22" stroke="none" stroke-width="1"/><text x="720" y="4016" fill="#10141E" font-family="Arial" font-size="12" font-weight="800" text-anchor="middle">BOOK A PLANNING CALL  →</text></svg>